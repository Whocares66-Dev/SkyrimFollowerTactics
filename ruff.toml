# ruff: the Python formatter and linter, over tools/ and dev/research/.
#
#   python -m ruff format    rewrites in place
#   python -m ruff check     lints
#
# The formatter is ruff's stock style, for the reason .clang-format is a
# stock preset. The lint rules are chosen as .clang-tidy's are: a finding is
# a plausible bug or a real cost, not a matter of taste -- pyflakes and
# pycodestyle's errors, bugbear, perflint, pylint's errors and warnings.
# Nothing stylistic: pylint's refactor group (magic values, too many
# branches), pyupgrade and the naming and docstring sets are left off.
target-version = "py311"
extend-exclude = ["extern"]

[lint]
select = ["E4", "E7", "E9", "F", "B", "PERF", "PLE", "PLW"]
