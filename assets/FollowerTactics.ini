; FollowerTactics -- settings.
;
; Everything here has a working default, so deleting this file changes nothing.
; It is read once, when the game starts: edit it with the game closed.

[Log]

; How much of FollowerTactics.log is written. The events file below is not
; filtered by it: it takes every game event.
;
;   error  something is broken until it is fixed
;   warn   the mod adapted or skipped something on its own
;   info   what happens while you play: rules firing, pins, casts   (default)
;   debug  everything, including per-tick readouts -- large, and for
;          working out why something did not happen
;
; The log is at
;   Documents\My Games\Skyrim Special Edition\SKSE\FollowerTactics.log
level = info

; What tactics did in the game -- rules firing, pins and bans, fights
; beginning and ending -- one JSON object per line, in
; FollowerTactics.events.jsonl beside the log, whatever the level above. For
; reading a fight afterwards ("did they cast twice?") and for attaching to a
; bug report. Off writes one fewer file.
events = true

[Interface]

; The panel's language: auto follows the game's own (sLanguage in
; Skyrim.ini), or name a catalog in SKSE\Plugins\FollowerTactics\Translations
; -- en-US, zh-CN. A line a catalog lacks reads in English.
language = auto
