name: Documentation

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths: ['CHANGELOG.md', 'docs/**', 'tools/build-docs.py', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Tag pushes refresh the site from master plus all release tags.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'master' || github.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build-docs.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs-site/SkyrimFollowerTactics

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
